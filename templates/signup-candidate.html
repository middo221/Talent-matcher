{% extends 'base.html' %}
{% block content %}
  <h1>Sign up as a candidate</h1>
  <p style="color: var(--color-text-muted); margin-bottom: var(--space-6);">
    Tell us about yourself so we can match you to the right opportunities.
  </p>

  <div class="form-card">
    <form method="post">
      <div class="form-section">
        <h3>Account</h3>
        <label>Email
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" name="password" required>
        </label>
      </div>

      <div class="form-section">
        <h3>Profile</h3>
        <label>Full name
          <input name="full_name" required>
        </label>
        <label>Contact (phone or alternate email)
          <input name="contact">
        </label>
        <label>Education
          <select name="education">
            <option value="">--</option>
            <option>High School</option>
            <option>Associate</option>
            <option>Bachelor</option>
            <option>Master</option>
            <option>PhD</option>
          </select>
        </label>
        <label>Major / field of study
          <input name="major">
        </label>
        <label>Years of experience
          <input type="number" name="years_experience" min="0" value="0">
        </label>
        <label>Work experience
          <textarea name="work_experience" rows="4"
                    placeholder="Briefly describe your most recent roles..."></textarea>
        </label>
        <label>Skills (comma-separated)
          <input name="skills" placeholder="python, sql, react">
        </label>
      </div>

      <div class="form-section">
        <h3>Preferences</h3>
        <label>Preferred working mode
          <select name="preferred_mode">
            <option>Remote</option>
            <option>On-site</option>
            <option>Hybrid</option>
          </select>
        </label>
        <label>Preferred location
          <input name="preferred_location" placeholder="e.g. Boston, MA">
        </label>
      </div>

      <button type="submit">Create account</button>
    </form>
  </div>
{% endblock %}
