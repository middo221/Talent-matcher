<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talent Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="{{ url_for('home') }}" class="nav-brand">
        Talent<span class="nav-brand-mark">.</span>Matcher
      </a>
      <div class="nav-links">
        {% if session.user_id %}
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('logout') }}">Log out</a>
        {% else %}
          <a href="{{ url_for('login') }}">Log in</a>
          <a href="{{ url_for('signup_candidate') }}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main>
    <div class="container">
      {% with messages = get_flashed_messages() %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
