{% extends 'base.html' %}
{% block content %}
  <div style="max-width: 420px; margin: var(--space-6) auto 0;">
    <h1 style="text-align: center;">Log in</h1>
    <div class="form-card">
      <form method="post">
        <label>Email
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" name="password" required>
        </label>
        <button type="submit" style="width: 100%; margin-top: var(--space-3);">Log in</button>
      </form>
    </div>
    <p style="text-align: center; margin-top: var(--space-5); color: var(--color-text-muted);">
      Don't have an account?
      <a href="{{ url_for('signup_candidate') }}">Sign up as candidate</a>
      or <a href="{{ url_for('signup_employer') }}">as employer</a>.
    </p>
  </div>
{% endblock %}
